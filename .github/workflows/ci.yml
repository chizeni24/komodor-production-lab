name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Shell syntax
        run: bash -n scripts/demo.sh scripts/smoke-test.sh
      - name: ConfigMap matches app.py
        run: python -B scripts/sync-configmap.py --check
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
